<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رسالة خاصة 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* الخلفية المتحركة */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        /* حاوية الشخصية */
        .character-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .click-hint {
            margin-bottom: 20px;
            font-size: 16px;
            color: #FCD535;
            animation: bounce 2s infinite;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(252, 213, 53, 0.5);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* رسمة القطة الكرتونية بـ CSS */
        .cat {
            position: relative;
            animation: breathe 3s infinite ease-in-out;
        }
        
        .cat-head {
            width: 140px;
            height: 110px;
            background: #EAECEF;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .ear {
            position: absolute;
            top: -20px;
            width: 0; height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 45px solid #EAECEF;
            z-index: -1;
        }
        .ear.left { left: 5px; transform: rotate(-25deg); }
        .ear.right { right: 5px; transform: rotate(25deg); }
        
        /* لون داخل الأذن */
        .ear::after {
            content: '';
            position: absolute;
            top: 15px; left: -10px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 25px solid #ffb6c1;
        }

        .eye {
            position: absolute;
            top: 45px;
            width: 22px; height: 22px;
            background: #111;
            border-radius: 50%;
            overflow: hidden;
        }
        .eye.left { left: 30px; }
        .eye.right { right: 30px; }
        
        /* لمعة العين المدمعة */
        .eye::before {
            content: ''; position: absolute;
            top: 3px; left: 4px;
            width: 8px; height: 8px;
            background: white; border-radius: 50%;
        }
        .eye::after {
            content: ''; position: absolute;
            top: 12px; left: 12px;
            width: 4px; height: 4px;
            background: white; border-radius: 50%;
        }

        .blush {
            position: absolute;
            top: 65px;
            width: 25px; height: 12px;
            background: rgba(255, 105, 180, 0.4);
            border-radius: 50%;
            filter: blur(3px);
        }
        .blush.left { left: 20px; }
        .blush.right { right: 20px; }

        .nose {
            position: absolute;
            top: 65px; left: 65px;
            width: 10px; height: 6px;
            background: #ffb6c1;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            top: 75px; left: 60px;
            width: 20px; height: 10px;
            border-bottom: 2px solid #555;
            border-radius: 50%;
        }

        /* دمعة تنزل من العين */
        .tear {
            position: absolute;
            top: 65px; left: 35px;
            width: 6px; height: 10px;
            background: #89CFF0;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            animation: dropTear 4s infinite 1s;
        }

        @keyframes dropTear {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.8; }
            40% { transform: translateY(30px); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-5px); }
        }

        /* رسالة الاعتذار */
        .message-container {
            position: absolute;
            width: 90%;
            max-width: 450px;
            background: rgba(22, 26, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        .message-container.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .heart-icon {
            font-size: 40px;
            color: #F6465D;
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease 0.5s;
        }
        
        .message-container.active .heart-icon {
            opacity: 1;
            transform: scale(1);
            animation: heartbeat 1.5s infinite 1s;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60%, 100% { transform: scale(1); }
        }

        .typed-text {
            font-size: 18px;
            line-height: 1.8;
            color: #EAECEF;
            min-height: 150px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background-color: #FCD535;
            animation: blink 0.7s infinite;
            vertical-align: middle;
            margin-right: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .fade-out {
            opacity: 0 !important;
            transform: scale(0.5) translateY(-100px) !important;
        }

    </style>
</head>
<body>

    <!-- خلفية النجوم -->
    <div class="stars" id="starsContainer"></div>

    <!-- الشخصية الكرتونية (القطة الحزينة) -->
    <div class="character-container" id="character" onclick="revealMessage()">
        <div class="click-hint">اضغطي علي 🥺</div>
        <div class="cat">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="cat-head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
                <div class="nose"></div>
                <div class="mouth"></div>
                <div class="tear"></div>
            </div>
        </div>
    </div>

    <!-- بطاقة الرسالة -->
    <div class="message-container" id="messageBox">
        <i class="fa-solid fa-heart-crack heart-icon" id="topIcon"></i>
        <div class="typed-text"><span id="textTarget"></span><span class="cursor"></span></div>
    </div>

    <script>
        // إنشاء خلفية النجوم المتحركة
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 50; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = (Math.random() * 2) + 's';
            starsContainer.appendChild(star);
        }

        // الرسالة المطلوبة
        const messageText = "اسف حياتي.. بس قررت ابطل من هالمشروع لأنو مُتعب مره ويستهلك طاقتي وتركيزي وانا اطور الموقع وما قدرت اكمل.. \n\nممكن بالايام الجاية نفكر بشيء احلى، وانا برضوا مالي خلقه مو ملتزم ادخل كل يوم اصور او ارفع شارت..\n\nسامحيني 🥺❤️";
        
        let i = 0;
        const speed = 60; // سرعة الكتابة

        function typeWriter() {
            if (i < messageText.length) {
                let char = messageText.charAt(i);
                if(char === '\n') {
                    document.getElementById("textTarget").innerHTML += "<br>";
                } else {
                    document.getElementById("textTarget").innerHTML += char;
                }
                i++;
                
                // تغيير الأيقونة بالنهاية من قلب مكسور لقلب سليم
                if(i === messageText.length) {
                    setTimeout(() => {
                        let icon = document.getElementById('topIcon');
                        icon.className = 'fa-solid fa-heart heart-icon';
                    }, 500);
                }
                
                setTimeout(typeWriter, speed);
            }
        }

        function revealMessage() {
            // إخفاء الشخصية
            document.getElementById('character').classList.add('fade-out');
            
            // إظهار الرسالة وبدء الكتابة
            setTimeout(() => {
                document.getElementById('character').style.display = 'none';
                document.getElementById('messageBox').classList.add('active');
                
                // تأخير بسيط قبل بدء الكتابة
                setTimeout(() => {
                    typeWriter();
                }, 1000);
                
            }, 600);
        }
    </script>
</body>
</html>
